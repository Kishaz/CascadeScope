name: Deploy CascadeScope (shinylive) to GitHub Pages

# Builds the app into a static, in-browser (webR) site with shinylive and
# publishes it to GitHub Pages. The configure-pages step enables Pages (source:
# GitHub Actions) on first run, so no manual repo setup is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: System dependency (libarchive, for the R 'archive' package)
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev

      - name: Install shinylive
        run: Rscript -e 'install.packages(c("archive", "shinylive"))'

      - name: Build the static app bundle
        run: |
          mkdir -p _app
          cp app.R ici_locked_reference.R score_cohort.R example_cohort.csv _app/
          cp -r references www _app/
          Rscript -e 'shinylive::export("_app", "_site")'

      - name: Enable GitHub Pages (idempotent; sets the source to GitHub Actions)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
